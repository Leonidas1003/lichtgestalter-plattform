<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lichtgestalter Plattform · Finanzdaten</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e7eaf0;background:#0c111c}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}input,select,textarea{background:#111a2b;border:1px solid #33435b;color:#fff;padding:11px;border-radius:9px;width:100%}label{font-size:12px;color:#a8b4c6;display:block;margin:10px 0 5px}button{background:#283850;color:#fff;border:1px solid #40526b;border-radius:9px;padding:10px 14px}button.primary{background:#5b80ef;border-color:#5b80ef}button.danger{color:#f7a9ae}button:disabled{opacity:.5}.wrap{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.muted{color:#94a2b6}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.nav button.active{background:#5b80ef}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:20px 0}.card,.panel{background:#151e2d;border:1px solid #2a374a;border-radius:15px;padding:19px}.card strong{font-size:26px;display:block;margin:10px 0}.card small{color:#a8b4c6}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input{width:auto}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:#9aaac0;font-weight:500}td,th{padding:12px 9px;border-bottom:1px solid #29374a;white-space:nowrap}tr.deleted{opacity:.45;text-decoration:line-through}.pill{padding:4px 8px;border-radius:20px;background:#2b3a51}.pill.open{color:#ffcf83}.pill.paid{color:#9ce6c0}.pill.cancelled,.pill.deleted{color:#f0a2a2}.actions{display:flex;gap:5px}td button{padding:5px 7px;font-size:12px}dialog{background:#192438;color:#fff;border:1px solid #52627b;border-radius:16px;width:min(590px,95vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#000a}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.span2{grid-column:span 2}.hidden{display:none!important}.notice{padding:12px;border:1px solid #6b5360;border-radius:10px;color:#ffc5c5;margin:15px 0}.right{text-align:right}.good{color:#a0e9bf}.bad{color:#ffb0b6}.small{font-size:12px}.selection-summary{position:fixed;bottom:12px;left:24px;right:24px;z-index:50;display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:#23314a;border:1px solid #536788;border-radius:12px;padding:14px 18px;margin-top:16px;box-shadow:0 -6px 25px #0009;max-width:1450px;margin-left:auto;margin-right:auto}body:has(.selection-summary) #content{padding-bottom:100px}body.embedded-finance .selection-summary{display:none!important}.selection-summary strong{color:#fff}.select-row,.select-all{width:17px;height:17px;cursor:pointer;accent-color:#7398ff}h1{margin:0;font-size:26px}h2{font-size:18px;margin:0 0 12px}@media(max-width:750px){.grid2{grid-template-columns:1fr}.wrap{padding:12px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}}
</style><link rel="stylesheet" href="finanz-theme.css"></head><body><div class="wrap"><header class="top"><div><h1>Finanzdaten</h1><div class="muted small" id="today"></div></div><div class="toolbar"><span class="muted small" id="user"></span><button id="logout" class="hidden">Abmelden</button></div></header>
<section id="setup" class="panel" style="max-width:530px;margin:50px auto"><h2>Admin-Anmeldung</h2><p class="muted">Melde dich mit deinem freigeschalteten Konto an.</p><label>E-Mail</label><input id="email" type="email" autocomplete="username"><label>Passwort</label><input id="password" type="password" autocomplete="current-password"><div class="toolbar"><button class="primary" id="login">Anmelden</button></div><div id="autherror" class="notice hidden"></div></section>
<main id="app" class="hidden"><nav class="nav" id="nav"><button data-tab="dashboard" class="active">Übersicht</button><button data-tab="expenses">Ausgaben</button><button data-tab="income">Einnahmen</button><button data-tab="recurring">Fixkosten & Wiederholungen</button><button data-tab="loans">Kredite</button><button data-tab="archive">Archiv</button><button data-tab="settings">Einstellungen</button></nav><div class="toolbar"><button id="prev">←</button><input type="month" id="month"><button id="next">→</button><button id="current">Aktueller Monat</button><span class="muted small">Offene Altposten werden in Folgemonaten weitergeführt.</span></div><div id="content"></div></main></div>
<dialog id="editor"><form id="editForm"><h2 id="modalTitle">Eintrag</h2><div class="formgrid" id="fields"></div><div class="toolbar" style="justify-content:flex-end"><button type="button" id="close">Abbrechen</button><button class="primary" type="submit">Speichern</button></div></form></dialog>
<script src="config.js"></script><script>
const $=s=>document.querySelector(s), euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseDE(value){
 const raw=String(value??'').trim().replace(/\s|€/g,'');
 if(!raw)return 0;
 let normalized=raw;
 if(raw.includes(','))normalized=raw.replace(/\./g,'').replace(',','.');
 else if(/^[-+]?\d{1,3}(\.\d{3})+$/.test(raw))normalized=raw.replace(/\./g,'');
 if(!/^[-+]?(?:\d+)(?:\.\d+)?$/.test(normalized))throw Error('Ungültige Zahl: '+raw+'. Bitte z. B. 1.234,56 eingeben.');
 const n=Number(normalized);if(!Number.isFinite(n))throw Error('Ungültiger Betrag');return n;
}
const formatDE=n=>new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0);
const selectedRows=new Set();
const financeViewKey='lg-finance-view-v21';
function rememberFinanceView(){try{sessionStorage.setItem(financeViewKey,JSON.stringify({selected,tab}))}catch{}}
function restoreFinanceView(){try{const x=JSON.parse(sessionStorage.getItem(financeViewKey)||'null');if(x&&/^\d{4}-(0[1-9]|1[0-2])$/.test(x.selected))selected=x.selected;if(x&&['dashboard','expenses','income','recurring','loans','profit','archive','settings'].includes(x.tab))tab=x.tab}catch{}}
function sendSelection(){
 const a=state.entries.filter(x=>selectedRows.has(x.id));
 const expenses=a.filter(x=>x.kind==='expense').reduce((s,x)=>s+Number(x.amount||0),0);
 const income=a.filter(x=>x.kind==='income').reduce((s,x)=>s+Number(x.amount||0),0);
 if(window.parent!==window)window.parent.postMessage({type:'lg-selection',count:a.length,expenses:euro(expenses),income:euro(income),net:euro(income-expenses)},location.origin);
}
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='lg-clear-selection'){selectedRows.clear();updateSelection()}});

const now=new Date(), iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, month0=iso(now).slice(0,7);let selected=month0, tab='dashboard', db=null, state={entries:[],recurrences:[],loans:[],profit_plans:[],settings:[],entry_payments:[]}, edit={}, partners=[], customers=[];
restoreFinanceView();
$('#today').textContent='Stand: '+new Intl.DateTimeFormat('de-DE',{dateStyle:'full'}).format(now);$('#month').value=selected;
function notify(msg){$('#autherror').textContent=msg;$('#autherror').classList.remove('hidden')}
// Trage hier einmalig die öffentlichen Supabase-Projektdaten ein.
const SUPABASE_URL = CLOUD_CONFIG.url;
const SUPABASE_PUBLISHABLE_KEY = CLOUD_CONFIG.anonKey;
function client(){
  if(!SUPABASE_URL.startsWith('https://') || SUPABASE_PUBLISHABLE_KEY.startsWith('HIER_')){
    notify('Die Supabase-Verbindung muss einmalig in der index.html hinterlegt werden.');
    return;
  }
  try { const base = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY); db = new Proxy(base, {get(target,prop){if(prop==='from')return table=>target.from(table.startsWith('lg_')?table:'fin_'+table);const v=target[prop];return typeof v==='function'?v.bind(target):v}}); }
  catch(e) { notify(e.message); }
}
$('#login').onclick=async()=>{try{if(!db)throw Error('Supabase-Verbindung fehlt in der index.html.');const {error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error)throw error;await boot()}catch(e){notify(e.message)}};
$('#logout').onclick=()=>{window.parent.postMessage({type:'lg-home'},location.origin)};
async function boot(){const {data:userResult,error:userError}=await db.auth.getUser();if(userError)throw Error('Anmeldung konnte nicht geprüft werden: '+userError.message);const user=userResult?.user;if(!user)return;if(!user.email_confirmed_at||!(/^[^@\s]+@dielichtgestalter\.de$/i.test(user.email||'')))throw Error('Nur bestätigte Firmenkonten.');const {error:adminError}=await db.from('lg_records').select('id').limit(1);if(adminError)throw Error('Kein Zugriff auf die Verwaltungsdatenbank: '+adminError.message);$('#autherror').classList.add('hidden');$('#setup').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#logout').textContent='Zur Startseite';$('#user').textContent=user.email;await refresh()}
let financeLoading=false,financeRefreshQueued=false;
async function refresh(){
 if(financeLoading){financeRefreshQueued=true;return;}
 financeLoading=true;
 try{
  const next={};
  for(const t of Object.keys(state)){
   let rows=[],offset=0;
   while(true){const {data,error}=await db.from(t).select('*').range(offset,offset+999);if(error)throw error;rows.push(...(data||[]));if(!data||data.length<1000)break;offset+=1000;}
   next[t]=rows;
  }
  state=next;
  await loadPartners();
  // Der Monatswechsel darf nicht durch einen Fehler bei der automatischen Generierung blockiert werden.
  try{await materialize()}catch(automationError){console.warn('Finanzautomatik:',automationError);}
  render();
 }catch(e){notify('Finanzdaten konnten nicht geladen werden: '+e.message);console.error('Finanzdaten-Ladefehler',e)}
 finally{financeLoading=false;if(financeRefreshQueued){financeRefreshQueued=false;void refresh()}}
}
async function loadPartners(){
 const [p,c]=await Promise.all([db.from('partners').select('id,name').order('name'),db.from('lg_records').select('id,data').eq('kind','customers')]);
 if(p.error)throw p.error;if(c.error)throw c.error;
 partners=p.data||[];customers=(c.data||[]).map(x=>({id:x.id,name:x.data?.name||x.id}));
}
function partnerName(e){if(e.kind==='income')return customers.find(c=>c.id===e.customer_id)?.name||'Nicht zugeordnet';return partners.find(p=>p.id===e.supplier_id)?.name||'Nicht zugeordnet'}
function controllingPage(){const year=selected.slice(0,4);const rows=state.entries.filter(e=>e.status!=='deleted'&&e.status!=='cancelled');const movements=[];
 for(const e of rows){const pay=payments(e);if(pay.length){for(const x of pay)if(x.paid_date?.startsWith(year))movements.push({entry:e,amount:Number(x.amount),date:x.paid_date})}
 else if(e.status==='paid'&&e.paid_date?.startsWith(year))movements.push({entry:e,amount:Number(e.amount),date:e.paid_date});}
 const section=(kind,title)=>{const groups=new Map();for(const m of movements.filter(x=>x.entry.kind===kind)){const name=partnerName(m.entry);if(!groups.has(name))groups.set(name,{sum:0,items:[]});const g=groups.get(name);g.sum+=m.amount;g.items.push(m)}return `<section class="panel"><h2>${title}</h2><table><thead><tr><th>Kunde / Lieferant</th><th>Buchungen</th><th>Bezahlt</th></tr></thead><tbody>${[...groups].sort((a,b)=>b[1].sum-a[1].sum).map(([name,g])=>`<tr><td>${esc(name)}</td><td>${g.items.length}</td><td>${euro(g.sum)}</td></tr>`).join('')||'<tr><td colspan="3">Keine Zahlungen</td></tr>'}</tbody></table></section>`};
 const inc=movements.filter(x=>x.entry.kind==='income').reduce((a,x)=>a+x.amount,0),exp=movements.filter(x=>x.entry.kind==='expense').reduce((a,x)=>a+x.amount,0);
 return `<section class="panel"><h2>Controlling · Zahlungsjahr ${year}</h2><p class="muted">Tatsächliche Zahlungen einschließlich Teilzahlungen nach Zahlungsdatum; offene Buchungen nicht enthalten.</p><label>Jahr <input type="number" id="controlYear" min="2000" max="2200" value="${year}" style="max-width:110px"></label><button id="controlApply">Anzeigen</button></section>`+cards([['Einnahmen',inc],['Ausgaben',exp],['Saldo',inc-exp]])+section('income','Einnahmen nach Kunden')+section('expense','Ausgaben nach Lieferanten');
}
function financeSearch(){return `<div class="toolbar"><input id="finSearch" placeholder="Suchen: Kunde, Lieferant, Buchung, Rechnungsnummer" value="${esc(window.finSearchText||'')}" style="width:min(100%,470px)"></div>`}
function datePlusMonths(str,n){let [y,m,d]=str.split('-').map(Number),dt=new Date(y,m-1+n,1),last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();dt.setDate(Math.min(d,last));return iso(dt)}
function occurrences(r,from,to){let arr=[],i=0,step={monthly:1,quarterly:3,yearly:12}[r.frequency];while(i<2400){let date=datePlusMonths(r.start_date,i*step);if(date>to||r.end_date&&date>r.end_date)break;if(date>=from)arr.push({kind:r.kind,name:r.name,invoice_no:r.invoice_no,amount:r.amount,due_date:date,status:'open',notes:r.notes,recurrence_id:r.id});i++}return arr}
async function materialize(){
  // Server-seitig atomar mit Advisory Lock: zwei Admins erzeugen keine doppelten Raten.
  const through=endMonth();
  const {data,error}=await db.rpc('lg_generate_finance_entries',{p_through:through});
  if(error)throw Error('Automatik nicht verfügbar. Bitte 04_finanzautomatik_v23.sql in Supabase ausführen. '+error.message);
  if(Number(data)>0){
    const {data:rows,error:readError}=await db.from('fin_entries').select('*').limit(10000);
    if(readError)throw readError;
    state.entries=rows||[];
  }
}
function inMonth(date){return date?.slice(0,7)===selected}function endMonth(){return selected+'-'+String(new Date(+selected.slice(0,4),+selected.slice(5),0).getDate()).padStart(2,'0')}
function payments(e){return state.entry_payments.filter(p=>p.entry_id===e.id)}
function paidAmount(e){return e.status==='paid'&&!payments(e).length?Number(e.amount):sum(payments(e))}
function remaining(e){return Math.max(0,Math.round((Number(e.amount)-paidAmount(e))*100)/100)}
function active(e){return e.status==='open'&&remaining(e)>0.005}function openThrough(kind){return state.entries.filter(e=>e.kind===kind&&active(e)&&e.due_date<=endMonth())}function monthItems(kind){return state.entries.filter(e=>e.kind===kind&&inMonth(e.due_date))}
function overdue(kind){return openThrough(kind).filter(e=>e.due_date<selected+'-01')}
function sum(a,key='amount'){return a.reduce((s,x)=>s+(key==='amount'&&x.kind&&x.due_date?remaining(x):Number(x[key]||0)),0)}function status(s){return `<span class="pill ${esc(s)}">${({open:'Offen',paid:'Bezahlt',cancelled:'Storniert',deleted:'Archiviert'})[s]||s}</span>`}
function cards(items){return `<div class="cards">${items.map(([title,n,sub,cls])=>`<div class="card"><small>${title}</small><strong class="${cls||''}">${euro(n)}</strong><small>${sub||''}</small></div>`).join('')}</div>`}
function entryTable(arr){arr=arr.filter(e=>e.status!=='deleted');return `<div class="tablewrap"><table><thead><tr><th><input type="checkbox" class="select-all" aria-label="Alle angezeigten Positionen auswählen"></th><th>Fälligkeit</th><th>Name</th><th>Rechnungsnr.</th><th>Betrag</th><th>Bezahlt</th><th>Offen</th><th>Status</th><th>Aktionen</th></tr></thead><tbody>${arr.sort((a,b)=>a.due_date.localeCompare(b.due_date)).map(e=>`<tr class="${e.status==='deleted'?'deleted':''}"><td><input type="checkbox" class="select-row" data-id="${e.id}" ${selectedRows.has(e.id)?'checked':''} aria-label="Position auswählen"></td><td>${esc(e.due_date)}</td><td>${esc(e.name)} ${e.recurrence_id?'↻':''}</td><td>${esc(e.invoice_no)}</td><td>${euro(e.amount)}</td><td>${euro(paidAmount(e))}</td><td>${euro(remaining(e))}</td><td>${status(e.status)}${e.status==='open'&&paidAmount(e)>0?' (Teilzahlung)':''}</td><td><div class="actions"><button data-edit="entries" data-id="${e.id}">Bearbeiten</button><button data-archive-table="entries" data-archive-id="${e.id}">Archivieren</button>${e.status==='open'?`<button data-payment="${e.id}">Teilzahlung</button><button data-status="paid" data-id="${e.id}">Bezahlt</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="9" class="muted">Keine Einträge</td></tr>'}</tbody></table></div>`}
function selectionSummary(){let arr=state.entries.filter(x=>selectedRows.has(x.id));let expenses=arr.filter(x=>x.kind==='expense'),income=arr.filter(x=>x.kind==='income');return arr.length===0?'':`<div class="selection-summary"><strong>Ausgewählt: <span id="selectedCount">${arr.length}</span> Positionen</strong><span>Ausgaben: <b id="selectedExpenses">${euro(expenses.reduce((s,x)=>s+remaining(x),0))}</b></span><span>Einnahmen: <b id="selectedIncome">${euro(income.reduce((s,x)=>s+remaining(x),0))}</b></span><span>Saldo: <b id="selectedNet">${euro(income.reduce((s,x)=>s+remaining(x),0)-expenses.reduce((s,x)=>s+remaining(x),0))}</b></span><button id="clearSelection">Auswahl aufheben</button></div>`}
function monthTitle(value){const [y,m]=value.split('-').map(Number);return new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(new Date(y,m-1,1))}
function render(){rememberFinanceView();let out='',ex=openThrough('expense'),inc=openThrough('income'),net=sum(inc)-sum(ex),p=state.profit_plans.filter(x=>x.expected_date?.slice(0,4)===selected.slice(0,4)&&x.status!=='deleted'&&x.status!=='cancelled');

if(tab==='dashboard'){out=cards([['Offene Ausgaben',sum(ex),'inkl. Altposten','bad'],['Offene Einnahmen',sum(inc),'inkl. Altposten','good'],['Erwarteter Netto-Zahlungsfluss',net,'offene Zahlungen',''],['Projektdeckungsbeitrag '+selected.slice(0,4),sum(p,'revenue')-sum(p,'costs'),'Gesamtes Kalenderjahr, nicht Cashflow','']])+`<div class="grid2"><section class="panel"><h2>Ausgaben: noch zu zahlen</h2><p class="muted">Davon aus Vormonaten: ${euro(sum(overdue('expense')))}</p>${entryTable(ex)}</section><section class="panel"><h2>Einnahmen: noch zu erhalten</h2><p class="muted">Davon aus Vormonaten: ${euro(sum(overdue('income')))}</p>${entryTable(inc)}</section></div>`}
if(tab==='expenses'||tab==='income'){let kind=tab==='expenses'?'expense':'income',a=monthItems(kind),old=overdue(kind);const term=(window.finSearchText||'').toLocaleLowerCase('de-DE');if(term){const matches=e=>[e.name,e.invoice_no,e.notes,partnerName(e)].some(x=>String(x||'').toLocaleLowerCase('de-DE').includes(term));a=a.filter(matches);old=old.filter(matches);}out=financeSearch()+`<div class="toolbar"><button class="primary" data-new="entries" data-kind="${kind}">+ ${kind==='expense'?'Ausgabe':'Einnahme'} erfassen</button></div>`+cards([['In diesem Monat fällig',sum(a.filter(active)),'offen'],['Offen aus Vormonaten',sum(old),'übertragen'],['Bereits bezahlt (Fälligkeit im Monat)',a.reduce((v,x)=>v+paidAmount(x),0),'historische Zahlungen']])+`<section class="panel"><h2>${esc(monthTitle(selected))} · Fälligkeiten</h2>${entryTable(a)}</section><section class="panel" style="margin-top:16px"><h2>Offene Altposten</h2>${entryTable(old)}</section>`}
if(tab==='recurring'){out='<div class="toolbar"><button class="primary" data-new="recurrences">+ Wiederholung anlegen</button></div><section class="panel"><h2>Fixkosten und wiederkehrende Einnahmen</h2><p class="muted small">Beenden über Enddatum oder Deaktivieren. Vergangene und bezahlte Buchungen bleiben erhalten; offene zukünftige Planbuchungen werden beim Archivieren oder Beenden archiviert.</p>'+genericTable('recurrences',['name','kind','amount','frequency','start_date','end_date','active'])+'</section>'}
if(tab==='loans'){out='<div class="toolbar"><button class="primary" data-new="loans">+ Kredit anlegen</button></div><section class="panel"><h2>Langfristige Kredite</h2><p class="muted small">Kredite können archiviert und im Archiv reaktiviert werden. Bereits erzeugte Raten und Zahlungen bleiben unverändert. Monatliche Kreditraten werden als Ausgaben erzeugt. Die Restschuld ist eine rechnerische Prognose aus Zinssatz und Rate, keine Bankbestätigung.</p>'+genericTable('loans',['name','principal','annual_rate','payment','first_due','end_date','active'])+'</section>'}
if(tab==='profit'){
 const year=selected.slice(0,4);
 const a=state.profit_plans.filter(x=>x.expected_date?.slice(0,4)===year&&!isArchived('profit_plans',x));
 const planned=a.filter(x=>x.status!=='cancelled');
 const revenue=sum(planned,'revenue'), costs=sum(planned,'costs');
 const years=[...new Set([year,String(now.getFullYear()),...state.profit_plans.map(x=>x.expected_date?.slice(0,4)).filter(Boolean)])].sort((a,b)=>b.localeCompare(a));
 out=`<div class="toolbar"><label for="profitYear">Geschäftsjahr</label><select id="profitYear">${years.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}</select><button id="profitPrev">← Vorjahr</button><button id="profitNext">Folgejahr →</button><button id="profitCurrent">Aktuelles Jahr</button><button class="primary" data-new="profit_plans">+ Projektplanung</button></div>`+
 `<p class="muted">Jahresübersicht ${year}: alle Projekte von Januar bis Dezember, unabhängig vom ausgewählten Liquiditätsmonat. Stornierte und archivierte Projekte sind nicht in den Summen enthalten. Realisierte Projekte werden mitgezählt.</p>`+
 cards([['Jahresumsatz '+year,revenue],['Jahreskosten '+year,costs],['Jahresdeckungsbeitrag '+year,revenue-costs]])+
 `<section class="panel"><h2>Projekte und Kunden · Gesamtjahr ${year} (${a.length})</h2>`+genericTable('profit_plans',['customer','project','expected_date','revenue','costs','status'],a)+'</section>';
}

function isArchived(t,x){return t==='loans'?!!x.deleted_at:t==='recurrences'?!!x.archived_at:x.status==='deleted'}
function genericTable(t,cols,visibleRows=null){const labels={name:'Bezeichnung',kind:'Art',amount:'Betrag',frequency:'Intervall',start_date:'Start',end_date:'Ende',active:'Aktiv',principal:'Kreditsumme',annual_rate:'Zins %',payment:'Monatsrate',first_due:'Erste Rate',customer:'Kunde',project:'Projekt',expected_date:'Erwartet',revenue:'Umsatz',costs:'Kosten',status:'Status'};return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${labels[c]}</th>`).join('')}<th>Aktionen</th></tr></thead><tbody>${(visibleRows??state[t].filter(x=>!isArchived(t,x))).map(x=>`<tr class="${x.status==='deleted'||t==='loans'&&x.deleted_at?'deleted':''}">${cols.map(c=>`<td>${['amount','principal','payment','revenue','costs'].includes(c)?euro(x[c]):c==='status'?status(x[c]):c==='active'?(x[c]?'Ja':'Nein'):esc(x[c])}</td>`).join('')}<td><button data-edit="${t}" data-id="${x.id}">Bearbeiten</button><button data-archive-table="${t}" data-archive-id="${x.id}">Archivieren</button></td></tr>`).join('')||`<tr><td colspan="${cols.length+1}">Keine Einträge</td></tr>`}</tbody></table></div>`}
async function setArchived(table,id,archive){
 const x=state[table].find(z=>z.id===id);if(!x)return;
 if(archive&&!confirm('Position archivieren? Die Daten und Zahlungen bleiben erhalten.'))return;
 if(!archive&&!confirm('Position reaktivieren?'))return;
 try{
  let values;
  if(table==='loans')values=archive?{active:false,deleted_at:new Date().toISOString(),archived_active:x.active}:{active:x.archived_active??true,deleted_at:null,archived_active:null};
  else if(table==='recurrences')values=archive?{active:false,archived_at:new Date().toISOString(),archived_active:x.active}:{active:x.archived_active??true,archived_at:null,archived_active:null};
  else values=archive?{status:'deleted',archived_status:x.status}:{status:x.archived_status||'open',archived_status:null};
  const {error}=await db.from(table).update(values).eq('id',id);if(error)throw error;
  if(table==='recurrences'&&archive){const result=await db.rpc('lg_reconcile_recurrence',{p_recurrence_id:id});if(result.error)throw Error('Wiederholung archiviert, aber künftige Buchungen konnten nicht bereinigt werden: '+result.error.message)}
  // Keine Buchungen oder Zahlungen löschen oder automatisch stornieren.
  // Bereits erzeugte Kredit-/Fixkostenraten bleiben bestehen.
  await refresh();
 }catch(e){alert('Archivänderung fehlgeschlagen: '+e.message)}
}
async function recordPayment(id){
 const e=state.entries.find(x=>x.id===id);if(!e||e.status!=='open')return;
 const input=prompt(`Teilzahlung für ${e.name}\nNoch offen: ${euro(remaining(e))}\nBetrag in EUR:`,formatDE(remaining(e)));if(input===null)return;
 let amount;try{amount=parseDE(input)}catch(err){return alert(err.message)}if(!Number.isFinite(amount)||amount<=0||amount>remaining(e)+0.001)return alert('Bitte einen Betrag zwischen 0 und dem offenen Restbetrag eingeben.');
 const date=prompt('Zahlungsdatum (JJJJ-MM-TT):',iso(new Date()));if(date===null)return;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(Date.parse(date)))return alert('Ungültiges Datum.');
 try{
  const {error}=await db.from('entry_payments').insert({entry_id:id,amount:Math.round(amount*100)/100,paid_date:date});if(error)throw error;
  if(amount>=remaining(e)-0.005){const {error:err}=await db.from('entries').update({status:'paid',paid_date:date}).eq('id',id);if(err)throw err}
  await refresh();
 }catch(err){alert('Teilzahlung konnte nicht gespeichert werden: '+err.message)}
}

function showEditor(table,id,kind){edit={table,id};let x=id?state[table].find(z=>z.id===id):{};$('#modalTitle').textContent=(id?'Bearbeiten: ':'Neu: ')+({entries:'Buchung',recurrences:'Wiederholung',loans:'Kredit',profit_plans:'Projektplanung'})[table];$('#fields').innerHTML=defs[table].map(([key,label,type,options])=>`<div class="${type==='textarea'?'span2':''}"><label>${label}</label>${type==='select'?`<select name="${key}">${options.split('|').map(o=>{let [v,l]=o.split(':');return `<option value="${v}" ${String(x?.[key]??(key==='kind'?kind:key==='status'?'open':key==='active'?true:''))===v?'selected':''}>${l}</option>`}).join('')}</select>`:type==='textarea'?`<textarea name="${key}">${esc(x?.[key]||'')}</textarea>`:`<input name="${key}" type="${type==='number'?'text':type}" ${type==='number'?'inputmode="decimal" placeholder="z. B. 1.234,56"':''} value="${esc(type==='number'&&x?.[key]!=null?formatDE(x[key]):x?.[key]??(type==='date'&&key==='due_date'?iso(now):''))}" ${['name','amount','due_date','start_date','first_due','payment','principal','customer','expected_date'].includes(key)?'required':''}>`}</div>`).join('');if(table==='entries'){$('#fields').insertAdjacentHTML('beforeend',`<div class="span2"><label>${(x?.kind||kind)==='income'?'Kunde':'Lieferant'} zuordnen</label><select name="${(x?.kind||kind)==='income'?'customer_id':'supplier_id'}" id="finParty"><option value="">Nicht zugeordnet</option>${((x?.kind||kind)==='income'?customers:partners).map(z=>`<option value="${esc(z.id)}" ${String((x?.kind||kind)==='income'?x?.customer_id:x?.supplier_id)===String(z.id)?'selected':''}>${esc(z.name)}</option>`).join('')}</select><button type="button" id="finNewParty" style="margin-top:12px">+ ${(x?.kind||kind)==='income'?'Kunde':'Lieferant'} anlegen</button></div>`);$('#fields').querySelector('select[name=kind]').onchange=e=>{const selected=e.target.value,sel=$('#finParty'),label=sel?.previousElementSibling;if(!sel)return;sel.name=selected==='income'?'customer_id':'suppl
