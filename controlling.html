<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controlling · Lichtgestalter</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e7eaf0;background:#0c111c}*{box-sizing:border-box}body{margin:0;padding:26px}button,select{font:inherit}button{cursor:pointer;background:#26374f;color:#e7eaf0;border:1px solid #405574;border-radius:9px;padding:9px 14px}button:hover{background:#385074}select{background:#26374f;color:white;padding:9px;border-radius:9px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.muted{color:#a8b3c6}.panel{background:#151f30;border:1px solid #30415c;border-radius:15px;padding:22px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.stats strong{font-size:26px;display:block;margin-top:10px}.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;overflow-x:auto}.month{min-width:70px;text-align:center;background:transparent;border:0;padding:7px}.month:hover,.month.active{background:#243653}.bars{height:170px;display:flex;align-items:flex-end;justify-content:center;gap:5px;border-bottom:1px solid #54637a}.bar{width:23px;min-height:2px;border-radius:4px 4px 0 0}.income{background:#65b5a6}.expense{background:#ef9a81}.legend{display:flex;gap:20px;margin:12px 0}.dot{width:10px;height:10px;display:inline-block;margin-right:5px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #344258;padding:12px 8px}th{color:#b3bfd1}tr{cursor:pointer}tbody tr:hover{background:#22334c}.good{color:#77d6bc}.bad{color:#f0aa95}.empty{padding:25px;color:#a8b3c6}@media(max-width:850px){.months{grid-template-columns:repeat(12,75px)}.stats{grid-template-columns:1fr}body{padding:14px}}

/* Modal editor, matching finance area */
.plan-overlay{position:fixed;inset:0;background:rgba(2,6,16,.78);display:flex;align-items:center;justify-content:center;z-index:9999;padding:18px}
.plan-modal{width:min(740px,100%);max-height:92vh;overflow:auto;background:#1a2639;border:1px solid #435a7b;border-radius:18px;padding:26px;box-shadow:0 24px 70px #0008}
.plan-modal .plan-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}

.plan-modal input,.plan-modal select{display:block;width:100%;min-height:43px;padding:10px 12px;border:1px solid #415775;border-radius:9px;background:#111c2c;color:#fff;font:inherit}
.plan-modal .plan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:16px 0}
.plan-modal .plan-field{min-width:0}.plan-modal .plan-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:25px}
.plan-modal button[type=submit]{background:#577ee9;border-color:#577ee9}.plan-modal .plan-add-customer{margin-top:12px}
@media(max-width:620px){.plan-modal .plan-grid{grid-template-columns:1fr}}
</style></head><body><div class="toolbar"><h1 style="margin:0 24px 0 0">Controlling</h1><button id="prev">← Vorjahr</button><select id="year" aria-label="Geschäftsjahr"></select><button id="next">Folgejahr →</button><button id="current">Aktuelles Jahr</button></div><p class="muted">Auswertung nach tatsächlichem Zahlungsdatum einschließlich Teilzahlungen. Klicke auf einen Monat, um die Buchungen und deren Zuordnung zu sehen.</p><div class="toolbar"><button id="showOverview">Jahresübersicht</button><button id="showSuppliers">Lieferanten ansehen</button><button id="showCustomers">Kunden ansehen</button><button id="showFixed">Fixkosten ansehen</button><button id="showProfit">Rentabilitätsplanung</button></div><div id="error" role="alert"></div><div id="content">Daten werden geladen …</div><script src="config.js"></script><script>
const fmt=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}),eur=n=>fmt.format(n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let year=new Date().getFullYear(),month=null,entries=[],payments=[],customers=new Map(),suppliers=new Map(),movements=[],recurrences=[],plans=[],section='overview';
const client=supabase.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.anonKey);
async function all(table,query){let result=[],offset=0;while(true){let q=client.from(table).select(query).range(offset,offset+999),{data,error}=await q;if(error)throw error;result.push(...data);if(data.length<1000)break;offset+=1000;}return result;}
async function load(){try{const user=await client.auth.getUser();if(!user.data.user){document.querySelector('#content').textContent='Bitte zuerst in der Plattform anmelden.';return;}const [e,p,c,s,r,pl]=await Promise.all([all('fin_entries','*'),all('fin_entry_payments','*'),all('lg_records','kind,id,data'),all('fin_partners','id,name'),all('fin_recurrences','*'),all('fin_profit_plans','*')]);entries=e;payments=p;recurrences=r;plans=pl;customers=new Map(c.filter(x=>x.kind==='customers').map(x=>[x.id,x.data?.name||x.id]));suppliers=new Map(s.map(x=>[x.id,x.name]));render();}catch(err){document.querySelector('#error').textContent='Daten konnten nicht geladen werden: '+err.message;}}
function calculate(){
 // Controlling bildet die erfassten Soll-Buchungen ab, nicht Zahlungseingaenge.
 // Jede Buchung wird genau einmal im Jahr und Monat ihrer Faelligkeit erfasst.
 movements=[];
 for(const e of entries){
  if(['deleted','cancelled'].includes(e.status))continue;
  if(e.kind!=='income'&&e.kind!=='expense')continue;
  const date=String(e.due_date||'');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!date.startsWith(String(year)))continue;
  movements.push({entry:e,amount:Number(e.amount)||0,date});
 }
}
function partner(e){return e.kind==='income'?customers.get(e.customer_id)||'Nicht zugeordnet':suppliers.get(e.supplier_id)||'Nicht zugeordnet';}
function render(){syncYear();if(section==='customers'){renderParties('income');return}if(section==='profit'){renderProfit();return}if(section==='suppliers'){renderSuppliers();return}if(section==='fixed'){renderFixed();return}calculate();const inc=movements.filter(m=>m.entry.kind==='income').reduce((a,m)=>a+m.amount,0),exp=movements.filter(m=>m.entry.kind==='expense').reduce((a,m)=>a+m.amount,0);const months=Array.from({length:12},(_,i)=>{const ms=movements.filter(m=>Number(m.date.slice(5,7))===i+1);return {i,inc:ms.filter(m=>m.entry.kind==='income').reduce((a,m)=>a+m.amount,0),exp:ms.filter(m=>m.entry.kind==='expense').reduce((a,m)=>a+m.amount,0)}});const max=Math.max(1,...months.flatMap(m=>[m.inc,m.exp]));const names=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];document.querySelector('#year').innerHTML=Array.from({length:15},(_,i)=>new Date().getFullYear()-10+i).concat(year).filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a-b).map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('');document.querySelector('#content').innerHTML=`<div class="stats"><section class="panel">Einnahmen<strong class="good">${eur(inc)}</strong></section><section class="panel">Ausgaben<strong class="bad">${eur(exp)}</strong></section><section class="panel">Saldo<strong>${eur(inc-exp)}</strong></section></div><section class="panel"><h2>Erfasste Einnahmen und Ausgaben nach Fälligkeit · ${year}</h2><div class="legend"><span><i class="dot income"></i>Einnahmen</span><span><i class="dot expense"></i>Ausgaben</span></div><div class="months">${months.map(m=>`<button class="month ${month===m.i?'active':''}" data-month="${m.i}" aria-label="${names[m.i]} Buchungen anzeigen"><div class="bars"><span class="bar income" style="height:${Math.max(2,m.inc/max*160)}px"></span><span class="bar expense" style="height:${Math.max(2,m.exp/max*160)}px"></span></div><strong>${names[m.i]}</strong><div class="muted" style="font-size:11px">${eur(m.inc)}<br>${eur(m.exp)}</div></button>`).join('')}</div></section><section class="panel"><h2>${month===null?'Alle Zahlungen '+year:'Buchungen · '+names[month]+' '+year}</h2><div class="toolbar"><button id="allmonths">Alle Monate</button><select id="kind"><option value="all">Einnahmen & Ausgaben</option><option value="income">Nur Einnahmen</option><option value="expense">Nur Ausgaben</option></select><select id="assignment"><option value="all">Alle Zuordnungen</option><option value="assigned">Zugeordnet</option><option value="unassigned">Nicht zugeordnet</option></select></div><div id="rows"></div></section><section class="panel"><h2>Zusammenfassung nach Kunden und Lieferanten</h2><div id="groups"></div></section>`;document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{month=Number(b.dataset.month);render()});document.querySelector('#allmonths').onclick=()=>{month=null;render()};document.querySelector('#kind').onchange=rows;document.querySelector('#assignment').onchange=rows;rows();groups();}
function filtered(){const kind=document.querySelector('#kind').value,assignment=document.querySelector('#assignment').value;return movements.filter(m=>(month===null||Number(m.date.slice(5,7))===month+1)&&(kind==='all'||m.entry.kind===kind)&&(assignment==='all'||(partner(m.entry)==='Nicht zugeordnet')===(assignment==='unassigned'))).sort((a,b)=>b.date.localeCompare(a.date));}
function rows(){const ms=filtered();document.querySelector('#rows').innerHTML=ms.length?`<div style="overflow:auto"><table><thead><tr><th>Fälligkeit</th><th>Art</th><th>Buchung</th><th>Beleg</th><th>Kunde / Lieferant</th><th>Zuordnung</th><th>Zahlungsstatus</th><th>Betrag</th></tr></thead><tbody>${ms.map(m=>`<tr><td>${esc(m.date)}</td><td>${m.entry.kind==='income'?'Einnahme':'Ausgabe'}</td><td>${esc(m.entry.name)}</td><td>${esc(m.entry.invoice_no)}</td><td>${esc(partner(m.entry))}</td><td>${partner(m.entry)==='Nicht zugeordnet'?'<span class="bad">Nicht zugeordnet</span>':'<span class="good">Zugeordnet</span>'}</td><td>${esc(m.entry.status==='paid'?'Bezahlt':m.entry.status==='open'?'Offen':m.entry.status)}</td><td>${eur(m.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Keine Buchungen für diese Auswahl.</p>';}
function groups(){const m=new Map();for(const x of movements){if(month!==null&&Number(x.date.slice(5,7))!==month+1)continue;const key=x.entry.kind+'|'+partner(x.entry);m.set(key,(m.get(key)||0)+x.amount)}document.querySelector('#groups').innerHTML=m.size?`<table><thead><tr><th>Art</th><th>Kunde / Lieferant</th><th>Summe</th></tr></thead><tbody>${[...m].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${k.split('|')[0]==='income'?'Einnahmen':'Ausgaben'}</td><td>${esc(k.slice(k.indexOf('|')+1))}</td><td>${eur(v)}</td></tr>`).join('')}</tbody></table>`:'<p class="empty">Keine Buchungen vorhanden.</p>';}

function paidRows(e){const ps=payments.filter(p=>p.entry_id===e.id);if(ps.length)return ps.filter(p=>String(p.paid_date||'').startsWith(String(year))).map(p=>({date:p.paid_date,amount:Number(p.amount||0),entry:e}));if(e.status==='paid'&&String(e.paid_date||'').startsWith(String(year)))return [{date:e.paid_date,amount:Number(e.amount||0),entry:e}];return []}
function syncYear(){const sel=document.querySelector('#year');const current=new Date().getFullYear();sel.innerHTML=Array.from(new Set([...Array.from({length:21},(_,i)=>current-10+i),year])).sort((a,b)=>a-b).map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}
function paidTotal(e){const ps=payments.filter(p=>p.entry_id===e.id);return ps.length?ps.reduce((s,p)=>s+Number(p.amount||0),0):e.status==='paid'?Number(e.amount||0):0}
function renderParties(kind){
 const isIncome=kind==='income', map=isIncome?customers:suppliers, key=isIncome?'customer_id':'supplier_id';
 const rows=entries.filter(e=>e.kind===kind&&!['deleted','cancelled'].includes(e.status)&&String(e.due_date||'').startsWith(String(year)));
 const groups=new Map();for(const e of rows){const id=e[key]||'none';if(!groups.has(id))groups.set(id,{name:map.get(id)||(id==='none'?'Nicht zugeordnet':id),rows:[]});groups.get(id).rows.push(e)}
 const arr=[...groups].filter(([,g])=>isIncome||g.rows.some(e=>paidRows(e).length>0)).sort((a,b)=>b[1].rows.reduce((s,e)=>s+Number(e.amount||0),0)-a[1].rows.reduce((s,e)=>s+Number(e.amount||0),0));
 const totals=arr.flatMap(([,g])=>g.rows), total=totals.reduce((s,e)=>s+Number(e.amount||0),0), paid=totals.reduce((s,e)=>s+paidTotal(e),0);
 const name=isIncome?'Kunden':'Lieferanten';
 document.querySelector('#content').innerHTML=`<h2>${name} · ${year}</h2><p class="muted">Buchungen nach Fälligkeitsjahr. Bezahlt berücksichtigt Teilzahlungen; offen ist der Restbetrag dieser Buchungen.</p><div class="stats"><section class="panel">Gesamtbetrag<strong>${eur(total)}</strong></section><section class="panel">Bezahlt<strong class="good">${eur(paid)}</strong></section><section class="panel">Offen<strong class="bad">${eur(Math.max(0,total-paid))}</strong></section></div><section class="panel"><table><thead><tr><th>${isIncome?'Kunde':'Lieferant'}</th><th>Gesamtbetrag</th><th>Bezahlt</th><th>Offen</th><th>Monate</th></tr></thead><tbody>${arr.map(([id,g],i)=>{const t=g.rows.reduce((s,e)=>s+Number(e.amount||0),0),p=g.rows.reduce((s,e)=>s+paidTotal(e),0);return `<tr><td><button data-party="${i}">${esc(g.name)}</button></td><td>${eur(t)}</td><td>${eur(p)}</td><td>${eur(Math.max(0,t-p))}</td><td>${[...new Set(g.rows.map(e=>String(e.due_date||'').slice(5,7)))].sort().join(', ')}</td></tr>`}).join('')}</tbody></table>${arr.length?'':'<p class="empty">Keine Buchungen im ausgewählten Jahr.</p>'}<div id="partyDetails"></div></section>${isIncome?renderUnbilled(rows):''}`;
 document.querySelectorAll('[data-party]').forEach(b=>b.onclick=()=>{const g=arr[Number(b.dataset.party)][1];document.querySelector('#partyDetails').innerHTML=`<h3>${esc(g.name)} · Buchungen</h3><table><thead><tr><th>Monat / Fälligkeit</th><th>Buchung</th><th>Beleg</th><th>Gesamtbetrag</th><th>Bezahlt</th><th>Offen</th></tr></thead><tbody>${g.rows.sort((a,b)=>String(b.due_date).localeCompare(String(a.due_date))).map(e=>`<tr><td>${esc(e.due_date)}</td><td>${esc(e.name)}</td><td>${esc(e.invoice_no||'Ohne Beleg')}</td><td>${eur(Number(e.amount))}</td><td>${eur(paidTotal(e))}</td><td>${eur(Math.max(0,Number(e.amount)-paidTotal(e)))}</td></tr>`).join('')}</tbody></table>`});
}
function renderUnbilled(rows){const unbilled=rows.filter(e=>e.customer_id&&!String(e.invoice_no||'').trim());return `<section class="panel"><h2>Zahlungen ohne Beleg · brutto</h2><p class="muted">Zugeordnete Kundeneinnahmen ohne Rechnungsnummer. Die Beträge werden als brutto behandelt.</p><table><thead><tr><th>Kunde</th><th>Monat</th><th>Gesamt brutto</th><th>Bezahlt brutto</th><th>Belegstatus</th></tr></thead><tbody>${unbilled.map(e=>`<tr><td>${esc(customers.get(e.customer_id)||e.customer_id)}</td><td>${esc(String(e.due_date).slice(0,7))}</td><td>${eur(Number(e.amount))}</td><td>${eur(paidTotal(e))}</td><td><button title="Kein Rechnungsbeleg hinterlegt" onclick="alert('Für diese Zahlung ist keine Rechnungsnummer hinterlegt. Bitte einen Beleg zuordnen.')">Beleg fehlt</button></td></tr>`).join('')}</tbody></table>${unbilled.length?'':'<p>Keine zugeordneten Buchungen ohne Beleg.</p>'}</section>`}
function renderSuppliers(){renderParties('expense')}
function occurrences(r){const dates=[];let d=new Date(String(r.start_date||'')+'T12:00:00');if(!Number.isFinite(d.getTime()))return dates;const end=r.end_date?new Date(r.end_date+'T12:00:00'):new Date(year,11,31,12);const step=r.frequency==='quarterly'?3:r.frequency==='yearly'?12:1;const day=d.getDate();for(let i=0;i<1200&&d.getFullYear()<=year&&d<=end;i++){if(d.getFullYear()===year)dates.push(new Date(d));const next=new Date(d.getFullYear(),d.getMonth()+step,1,12);next.setDate(Math.min(day,new Date(next.getFullYear(),next.getMonth()+1,0).getDate()));d=next}return dates}
function fixedRows(){return recurrences.filter(r=>!r.archived_at&&r.active!==false&&r.kind==='expense').map(r=>({...r,yearCount:occurrences(r).length,yearCost:occurrences(r).length*Number(r.amount||0)})).filter(r=>r.yearCount>0)}
function renderFixed(){const rows=fixedRows(),total=rows.reduce((s,r)=>s+r.yearCost,0);document.querySelector('#content').innerHTML=`<div class="stats"><section class="panel">Fixkostenblock ${year}<strong>${eur(total)}</strong></section><section class="panel">Aktive Positionen<strong>${rows.length}</strong></section></div><section class="panel"><h2>Fixkosten · Jahresbetrachtung ${year}</h2><p class="muted">Wiederkehrende Vorlagen nach tatsächlichen Terminen im gewählten Jahr. Diese Jahressummen werden nicht zusätzlich in die Ist-Buchungen der Jahresübersicht aufgenommen.</p><table><thead><tr><th>Position</th><th>Je Intervall</th><th>Häufigkeit</th><th>Termine ${year}</th><th>Jahreskosten</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${eur(Number(r.amount))}</td><td>${esc(r.frequency)}</td><td>${r.yearCount}</td><td>${eur(r.yearCost)}</td></tr>`).join('')}</tbody><tfoot><tr><th>Gesamter Fixkostenblock</th><th></th><th></th><th></th><th>${eur(total)}</th></tr></tfoot></table></section>`}
function validPlans(){return plans.filter(p=>String(p.expected_date||'').startsWith(String(year))&&!['deleted','cancelled'].includes(p.status))}
function renderProfit(){const ps=validPlans(),fixed=fixedRows().reduce((s,r)=>s+r.yearCost,0),revenue=ps.reduce((s,p)=>s+Number(p.revenue||0),0),costs=ps.reduce((s,p)=>s+Number(p.costs||0),0),max=Math.max(1,revenue,fixed+costs);document.querySelector('#content').innerHTML=`<h2>Rentabilitätsplanung ${year}</h2><div class="toolbar"><button id="newPlan">+ Planung anlegen</button><button id="reloadPlan">Aktualisieren</button></div><div id="planForm" tabindex="-1"></div><div class="stats"><section class="panel">Geplante Einnahmen<strong class="good">${eur(revenue)}</strong></section><section class="panel">Fixkosten<strong>${eur(fixed)}</strong></section><section class="panel">Geplante Projektkosten<strong>${eur(costs)}</strong></section><section class="panel">Geplanter Überschuss<strong>${eur(revenue-fixed-costs)}</strong></section></div><section class="panel"><h3>Jahresvergleich Einnahmen und Ausgaben</h3><div style="display:flex;gap:38px;align-items:flex-end;height:220px;padding:20px"><div style="flex:1;text-align:center"><div style="height:${Math.max(2,revenue/max*150)}px;background:#30a477;border-radius:6px"></div>Einnahmen<br>${eur(revenue)}</div><div style="flex:1;text-align:center"><div style="height:${Math.max(2,costs/max*150)}px;background:#d9a34b;border-radius:6px 6px 0 0"></div><div style="height:${Math.max(2,fixed/max*150)}px;background:#be6c77"></div>Ausgaben<br>${eur(fixed+costs)}</div></div><p class="muted">Grün: geplante Einnahmen · Gelb: geplante Projektkosten · Rot: Fixkosten. Werte gemäß den in der App erfassten Planungen.</p></section><section class="panel"><h3>Planungen nach Kunde</h3><table><thead><tr><th>Kunde</th><th>Projekt</th><th>Erwartet</th><th>Umsatz netto</th><th>Projektkosten netto</th><th>Aktion</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.customer)}</td><td>${esc(p.project)}</td><td>${esc(p.expected_date)}</td><td>${eur(Number(p.revenue))}</td><td>${eur(Number(p.costs))}</td><td><button data-edit-plan="${esc(p.id)}">Bearbeiten</button> <button data-delete-plan="${esc(p.id)}" style="background:#7b3440;border-color:#9c4b58">Löschen</button></td></tr>`).join('')}</tbody></table></section>`;document.querySelector('#newPlan').onclick=()=>planForm();document.querySelector('#reloadPlan').onclick=load;document.querySelectorAll('[data-edit-plan]').forEach(b=>b.onclick=()=>planForm(b.dataset.editPlan));document.querySelectorAll('[data-delete-plan]').forEach(b=>b.onclick=()=>deletePlan(b.dataset.deletePlan))}
async function deletePlan(id){
 const plan=plans.find(p=>String(p.id)===String(id));if(!plan)return;
 if(!confirm(`Planung „${plan.project||'Ohne Projektname'}“ für ${plan.customer||'ohne Kunden'} wirklich löschen?\n\nDie Position wird aus der Rentabilitätsplanung und den Jahresauswertungen entfernt.`))return;
 const button=Array.from(document.querySelectorAll('[data-delete-plan]')).find(b=>b.dataset.deletePlan===String(id));if(button){button.disabled=true;button.textContent='Löscht …'}
 try{const {error}=await client.from('fin_profit_plans').update({status:'deleted'}).eq('id',id);if(error)throw error;await load()}
 catch(e){alert('Löschen fehlgeschlagen: '+e.message);if(button){button.disabled=false;button.textContent='Löschen'}}
}
function closePlanModal(){document.getElementById('planOverlay')?.remove()}
function planForm(id){
 const p=plans.find(x=>String(x.id)===String(id))||{};
 closePlanModal();
 const overlay=document.createElement('div');overlay.id='planOverlay';overlay.className='plan-overlay';
 overlay.innerHTML=`<div class="plan-modal" role="dialog" aria-modal="true" aria-label="${id?'Planung bearbeiten':'Neue Planung'}">
 <div class="plan-header"><h2>${id?'Planung bearbeiten':'Neue Planung'}</h2><button type="button" id="closePlan">✕</button></div>
 <form id="planEditor">
 <div class="plan-field"><label for="planCustomer">Kunde</label><select id="planCustomer" name="customer" required><option value="">Kunde auswählen</option>${[...customers].sort((a,b)=>a[1].localeCompare(b[1],'de')).map(([cid,name])=>`<option value="${esc(name)}" ${p.customer===name?'selected':''}>${esc(name)}</option>`).join('')}</select><button type="button" class="plan-add-customer" id="newPlanCustomer">+ Kunde anlegen</button></div>
 <div class="plan-grid"><div class="plan-field"><label for="planProject">Projekt</label><input id="planProject" name="project" value="${esc(p.project||'')}" required></div><div class="plan-field"><label for="planDate">Erwartetes Datum</label><input id="planDate" type="date" name="expected_date" value="${esc(p.expected_date||year+'-01-01')}" required></div>
 <div class="plan-field"><label for="planRevenue">Geplanter Umsatz netto (€)</label><input id="planRevenue" name="revenue" type="number" min="0" step="0.01" value="${Number(p.revenue||0)}" required></div><div class="plan-field"><label for="planCosts">Geplante Projektkosten netto (€)</label><input id="planCosts" name="costs" type="number" min="0" step="0.01" value="${Number(p.costs||0)}" required></div></div>
 <div class="plan-actions"><button type="button" id="cancelPlan">Abbrechen</button><button type="submit" id="savePlan">Planung speichern</button></div>
 </form></div>`;
 document.body.appendChild(overlay);
 overlay.addEventListener('click',ev=>{if(ev.target===overlay)closePlanModal()});
 overlay.querySelector('#closePlan').onclick=closePlanModal;
 overlay.querySelector('#cancelPlan').onclick=closePlanModal;
 overlay.querySelector('#newPlanCustomer').onclick=async()=>{
  const name=prompt('Neuer Kunde – Name:');if(!name?.trim())return;
  try{
   const cid='id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
   const {error}=await client.rpc('lg_apply_changes',{p_changes:[{kind:'customers',id:cid,op:'insert',version:0,data:{id:cid,name:name.trim()}}]});
   if(error)throw error;
   customers.set(cid,name.trim());
   const select=overlay.querySelector('#planCustomer'),option=document.createElement('option');option.value=name.trim();option.textContent=name.trim();select.appendChild(option);select.value=name.trim();
  }catch(e){alert('Kunde konnte nicht angelegt werden: '+e.message)}
 };
 overlay.querySelector('#planEditor').onsubmit=async ev=>{
  ev.preventDefault();
  const button=overlay.querySelector('#savePlan');button.disabled=true;button.textContent='Speichert …';
  const fd=new FormData(ev.target),obj={customer:fd.get('customer'),project:fd.get('project'),expected_date:fd.get('expected_date'),revenue:Number(fd.get('revenue')),costs:Number(fd.get('costs')),status:p.status||'open'};
  try{
   const q=id?client.from('fin_profit_plans').update(obj).eq('id',id):client.from('fin_profit_plans').insert(obj);
   const {error}=await q;if(error)throw error;
   closePlanModal();await load();
  }catch(e){alert('Speichern fehlgeschlagen: '+e.message);button.disabled=false;button.textContent='Planung speichern'}
 };
 overlay.querySelector('#planCustomer').focus();
}

document.querySelector('#showOverview').onclick=()=>{section='overview';render()};
document.querySelector('#showSuppliers').onclick=()=>{section='suppliers';render()};
document.querySelector('#showFixed').onclick=()=>{section='fixed';render()};
document.querySelector('#showCustomers').onclick=()=>{section='customers';render()};
document.querySelector('#showProfit').onclick=()=>{section='profit';render()};

document.querySelector('#prev').onclick=()=>{year--;month=null;render()};document.querySelector('#next').onclick=()=>{year++;month=null;render()};document.querySelector('#current').onclick=()=>{year=new Date().getFullYear();month=null;render()};document.querySelector('#year').onchange=e=>{year=Number(e.target.value);month=null;render()};load();
</script></body></html>
