<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controlling · Lichtgestalter</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e7eaf0;background:#0c111c}*{box-sizing:border-box}body{margin:0;padding:26px}button,select{font:inherit}button{cursor:pointer;background:#26374f;color:#e7eaf0;border:1px solid #405574;border-radius:9px;padding:9px 14px}button:hover{background:#385074}select{background:#26374f;color:white;padding:9px;border-radius:9px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.muted{color:#a8b3c6}.panel{background:#151f30;border:1px solid #30415c;border-radius:15px;padding:22px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.stats strong{font-size:26px;display:block;margin-top:10px}.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;overflow-x:auto}.month{min-width:70px;text-align:center;background:transparent;border:0;padding:7px}.month:hover,.month.active{background:#243653}.bars{height:170px;display:flex;align-items:flex-end;justify-content:center;gap:5px;border-bottom:1px solid #54637a}.bar{width:23px;min-height:2px;border-radius:4px 4px 0 0}.income{background:#65b5a6}.expense{background:#ef9a81}.legend{display:flex;gap:20px;margin:12px 0}.dot{width:10px;height:10px;display:inline-block;margin-right:5px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #344258;padding:12px 8px}th{color:#b3bfd1}tr{cursor:pointer}tbody tr:hover{background:#22334c}.good{color:#77d6bc}.bad{color:#f0aa95}.empty{padding:25px;color:#a8b3c6}@media(max-width:850px){.months{grid-template-columns:repeat(12,75px)}.stats{grid-template-columns:1fr}body{padding:14px}}
</style></head><body><div class="toolbar"><h1 style="margin:0 24px 0 0">Controlling</h1><button id="prev">← Vorjahr</button><select id="year" aria-label="Geschäftsjahr"></select><button id="next">Folgejahr →</button><button id="current">Aktuelles Jahr</button></div><p class="muted">Auswertung nach tatsächlichem Zahlungsdatum einschließlich Teilzahlungen. Klicke auf einen Monat, um die Buchungen und deren Zuordnung zu sehen.</p><div id="error" role="alert"></div><div id="content">Daten werden geladen …</div><script src="config.js"></script><script>
const fmt=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}),eur=n=>fmt.format(n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let year=new Date().getFullYear(),month=null,entries=[],payments=[],customers=new Map(),suppliers=new Map(),movements=[];
const client=supabase.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.anonKey);
async function all(table,query){let result=[],offset=0;while(true){let q=client.from(table).select(query).range(offset,offset+999),{data,error}=await q;if(error)throw error;result.push(...data);if(data.length<1000)break;offset+=1000;}return result;}
async function load(){try{const user=await client.auth.getUser();if(!user.data.user){document.querySelector('#content').textContent='Bitte zuerst in der Plattform anmelden.';return;}const [e,p,c,s]=await Promise.all([all('fin_entries','*'),all('fin_entry_payments','*'),all('lg_records','kind,id,data'),all('fin_partners','id,name')]);entries=e;payments=p;customers=new Map(c.filter(x=>x.kind==='customers').map(x=>[x.id,x.data?.name||x.id]));suppliers=new Map(s.map(x=>[x.id,x.name]));render();}catch(err){document.querySelector('#error').textContent='Daten konnten nicht geladen werden: '+err.message;}}
function calculate(){const byEntry=new Map();for(const p of payments){if(!byEntry.has(p.entry_id))byEntry.set(p.entry_id,[]);byEntry.get(p.entry_id).push(p);}movements=[];for(const e of entries){if(['deleted','cancelled'].includes(e.status))continue;const pp=byEntry.get(e.id)||[];if(pp.length){for(const p of pp){if(p.paid_date?.startsWith(String(year)))movements.push({entry:e,amount:Number(p.amount)||0,date:p.paid_date});}}else if(e.status==='paid'&&e.paid_date?.startsWith(String(year))){movements.push({entry:e,amount:Number(e.amount)||0,date:e.paid_date});}}}
function partner(e){return e.kind==='income'?customers.get(e.customer_id)||'Nicht zugeordnet':suppliers.get(e.supplier_id)||'Nicht zugeordnet';}
function render(){calculate();const inc=movements.filter(m=>m.entry.kind==='income').reduce((a,m)=>a+m.amount,0),exp=movements.filter(m=>m.entry.kind==='expense').reduce((a,m)=>a+m.amount,0);const months=Array.from({length:12},(_,i)=>{const ms=movements.filter(m=>Number(m.date.slice(5,7))===i+1);return {i,inc:ms.filter(m=>m.entry.kind==='income').reduce((a,m)=>a+m.amount,0),exp:ms.filter(m=>m.entry.kind==='expense').reduce((a,m)=>a+m.amount,0)}});const max=Math.max(1,...months.flatMap(m=>[m.inc,m.exp]));const names=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];document.querySelector('#year').innerHTML=Array.from({length:15},(_,i)=>new Date().getFullYear()-10+i).concat(year).filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a-b).map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('');document.querySelector('#content').innerHTML=`<div class="stats"><section class="panel">Einnahmen<strong class="good">${eur(inc)}</strong></section><section class="panel">Ausgaben<strong class="bad">${eur(exp)}</strong></section><section class="panel">Saldo<strong>${eur(inc-exp)}</strong></section></div><section class="panel"><h2>Monatliche Einnahmen und Ausgaben · ${year}</h2><div class="legend"><span><i class="dot income"></i>Einnahmen</span><span><i class="dot expense"></i>Ausgaben</span></div><div class="months">${months.map(m=>`<button class="month ${month===m.i?'active':''}" data-month="${m.i}" aria-label="${names[m.i]} Buchungen anzeigen"><div class="bars"><span class="bar income" style="height:${Math.max(2,m.inc/max*160)}px"></span><span class="bar expense" style="height:${Math.max(2,m.exp/max*160)}px"></span></div><strong>${names[m.i]}</strong><div class="muted" style="font-size:11px">${eur(m.inc)}<br>${eur(m.exp)}</div></button>`).join('')}</div></section><section class="panel"><h2>${month===null?'Alle Zahlungen '+year:'Buchungen · '+names[month]+' '+year}</h2><div class="toolbar"><button id="allmonths">Alle Monate</button><select id="kind"><option value="all">Einnahmen & Ausgaben</option><option value="income">Nur Einnahmen</option><option value="expense">Nur Ausgaben</option></select><select id="assignment"><option value="all">Alle Zuordnungen</option><option value="assigned">Zugeordnet</option><option value="unassigned">Nicht zugeordnet</option></select></div><div id="rows"></div></section><section class="panel"><h2>Zusammenfassung nach Kunden und Lieferanten</h2><div id="groups"></div></section>`;document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{month=Number(b.dataset.month);render()});document.querySelector('#allmonths').onclick=()=>{month=null;render()};document.querySelector('#kind').onchange=rows;document.querySelector('#assignment').onchange=rows;rows();groups();}
function filtered(){const kind=document.querySelector('#kind').value,assignment=document.querySelector('#assignment').value;return movements.filter(m=>(month===null||Number(m.date.slice(5,7))===month+1)&&(kind==='all'||m.entry.kind===kind)&&(assignment==='all'||(partner(m.entry)==='Nicht zugeordnet')===(assignment==='unassigned'))).sort((a,b)=>b.date.localeCompare(a.date));}
function rows(){const ms=filtered();document.querySelector('#rows').innerHTML=ms.length?`<div style="overflow:auto"><table><thead><tr><th>Zahlungsdatum</th><th>Art</th><th>Buchung</th><th>Beleg</th><th>Kunde / Lieferant</th><th>Zuordnung</th><th>Betrag</th></tr></thead><tbody>${ms.map(m=>`<tr><td>${esc(m.date)}</td><td>${m.entry.kind==='income'?'Einnahme':'Ausgabe'}</td><td>${esc(m.entry.name)}</td><td>${esc(m.entry.invoice_no)}</td><td>${esc(partner(m.entry))}</td><td>${partner(m.entry)==='Nicht zugeordnet'?'<span class="bad">Nicht zugeordnet</span>':'<span class="good">Zugeordnet</span>'}</td><td>${eur(m.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Keine Zahlungen für diese Auswahl.</p>';}
function groups(){const m=new Map();for(const x of movements){if(month!==null&&Number(x.date.slice(5,7))!==month+1)continue;const key=x.entry.kind+'|'+partner(x.entry);m.set(key,(m.get(key)||0)+x.amount)}document.querySelector('#groups').innerHTML=m.size?`<table><thead><tr><th>Art</th><th>Kunde / Lieferant</th><th>Summe</th></tr></thead><tbody>${[...m].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${k.split('|')[0]==='income'?'Einnahmen':'Ausgaben'}</td><td>${esc(k.slice(k.indexOf('|')+1))}</td><td>${eur(v)}</td></tr>`).join('')}</tbody></table>`:'<p class="empty">Keine Zahlungen vorhanden.</p>';}
document.querySelector('#prev').onclick=()=>{year--;month=null;render()};document.querySelector('#next').onclick=()=>{year++;month=null;render()};document.querySelector('#current').onclick=()=>{year=new Date().getFullYear();month=null;render()};document.querySelector('#year').onchange=e=>{year=Number(e.target.value);month=null;render()};load();
</script></body></html>
